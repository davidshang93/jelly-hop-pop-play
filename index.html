<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Jelly Hop Pop</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Hold to charge, let go to hop. Land dead center for double points, match 3 colors to pop!">
<meta property="og:title" content="Jelly Hop Pop">
<meta property="og:description" content="Hold to charge, let go to hop. Land dead center for double points, match 3 colors to pop!">
<meta property="og:image" content="https://davidshang93.github.io/jelly-hop-pop-play/icon-512.jpg">
<meta property="og:url" content="https://davidshang93.github.io/jelly-hop-pop-play/">
<meta name="twitter:card" content="summary">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Jelly Hop Pop">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#f7c6dc">
<meta name="format-detection" content="telephone=no">
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #f7c6dc; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #GameDiv, #Cocos3dGameContainer, #GameCanvas { display: block; width: 100%; height: 100%; outline: none; }
  #GameDiv { margin: 0 auto; }
  #GameCanvas { background: transparent; }
</style>
</head>
<body>
<div id="GameDiv">
  <div id="Cocos3dGameContainer"><canvas id="GameCanvas" tabindex="99"></canvas></div>
</div>
<script>
  (function () {
    var div = document.getElementById('GameDiv');
    function fit() {
      var h = window.innerHeight, w = Math.min(window.innerWidth, Math.round(h * 9 / 16));
      div.style.width = w + 'px';
      div.style.height = h + 'px';
    }
    fit();
    window.addEventListener('resize', fit);
    // 长按时别弹系统菜单、别选文字（这游戏全靠按住）
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  })();
</script>
<script src="src/polyfills.bundle.js" charset="utf-8"></script>
<script src="src/system.bundle.js" charset="utf-8"></script>
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"></script>
<script>System.import('./index.js').catch(function (err) { console.error(err); });</script>
</body>
</html>
